name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: yourtaste-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node scripts/check-audit.mjs /tmp/npm-audit.json
      - run: npm run verify:source
      - run: npm run test:security
      - run: node --check scripts/test-staging-authorization.mjs
      - run: npm --workspace apps/web run lint
      - run: npm run typecheck
      - run: npm run build:web
      - name: Validate Expo project
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Bundle Android app
        working-directory: apps/mobile
        run: npx expo export --platform android
