name: Temporary non-breaking dependency remediation
on:
  push:
    branches: [automation/nonbreaking-audit-fix]
permissions:
  contents: write
concurrency:
  group: yourtaste-audit-remediation
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply non-breaking npm audit fixes only
        run: npm audit fix --no-fund
      - name: Report remaining advisories
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable})).slice(0,80)},null,2))"
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json apps/*/package.json packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit -m "security: apply non-breaking npm audit fixes"
            git push origin HEAD:${{ github.ref_name }}
          fi
