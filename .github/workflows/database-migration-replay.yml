name: Database migration replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"

permissions:
  contents: read

concurrency:
  group: yourtaste-db-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start an isolated local Supabase stack
        run: supabase start --exclude studio,mail,analytics,realtime,storage,functions
      - name: Replay every migration from an empty database
        run: supabase db reset
      - name: Install PostgreSQL client for SQL smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run catalog and privilege smoke test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/security_smoke.sql
      - name: Run privileged-function guard test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/authz_function_guards.sql
      - name: Run customer ownership and RLS integration tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_ownership.sql
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
