name: Temporary dependency migration validation
on:
  push:
    branches: [automation/dependency-major-upgrade]
permissions:
  contents: write
concurrency:
  group: yourtaste-major-dependency-migration
  cancel-in-progress: false
jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve workspace dependencies
        run: npm install --no-fund --no-audit
      - name: Align native dependencies with Expo SDK
        working-directory: apps/mobile
        run: npx expo install --fix
      - name: Install required Expo Router peer dependencies
        working-directory: apps/mobile
        run: npx expo install expo-constants expo-linking
      - name: Regenerate lockfile from workspace manifests
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-fund --no-audit
      - name: Commit lockfile and Expo compatibility adjustments before validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json apps/*/package.json packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update dependency lockfile for patched releases"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Clean install from committed lockfile
        run: npm ci
      - name: Report remaining dependency advisories
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable}))},null,2))"
      - name: Run repository checks
        run: |
          npm run verify:source
          npm run test:security
          npm run typecheck
          npm run build:web
      - name: Validate Expo project
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Bundle Android app
        working-directory: apps/mobile
        run: npx expo export --platform android
